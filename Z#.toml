[package]
name = "zlb"
version = "0.1.0"
kind = "bin"
entry = "src/main.zsharp"
description = "zlb — Zenit Linux Builder: produkcyjne obrazy ISO z openSUSE Tumbleweed (zenitd zamiast systemd)"
license = "MPL-2.0"

# `import Workspace.<człon>;` — ścieżki względem tego pliku
[workspace.members]
util       = "src/util.zsharp"
runner     = "src/runner.zsharp"
config     = "src/config.zsharp"
pkglist    = "src/pkglist.zsharp"
ctx        = "src/ctx.zsharp"
repos      = "src/repos.zsharp"
packages   = "src/packages.zsharp"
hooks      = "src/hooks.zsharp"
overlay    = "src/overlay.zsharp"
initsys    = "src/initsys.zsharp"
system     = "src/system.zsharp"
initrd     = "src/initrd.zsharp"
cleanup    = "src/cleanup.zsharp"
image      = "src/image.zsharp"
outputs    = "src/outputs.zsharp"
doctor     = "src/doctor.zsharp"
build      = "src/build.zsharp"
scaffold   = "src/scaffold.zsharp"
cli        = "src/cli.zsharp"
manifest   = "src/manifest.zsharp"
verify     = "src/verify.zsharp"
